# CI cost note: GitHub bills macOS runner minutes at 10x the Linux rate on
# private repositories. Each run here uses a macos-15 job, so while this repo
# is private, every push and pull request costs about ten times a Linux run.
# Keep triggers narrow (see `on:` below) and cancel superseded runs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
